<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar com passkey</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif;
             background: linear-gradient(135deg, #0f172a, #111827); color: #e5e7eb; }
      .card { width: min(92vw, 440px); background: rgba(17, 24, 39, 0.95); border: 1px solid rgba(148, 163, 184, 0.18);
              border-radius: 18px; padding: 32px 28px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25); }
      h1 { margin: 0 0 10px; text-align: center; }
      p { margin: 0 0 24px; text-align: center; color: #cbd5e1; }
      input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a;
              color: #f8fafc; font-size: 1rem; margin-bottom: 18px; }
      button { width: 100%; padding: 12px 16px; border: none; border-radius: 10px;
               background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #082f49; font-weight: bold; font-size: 1rem; cursor: pointer; }
      button:disabled { opacity: 0.65; cursor: wait; }
      label { display: block; margin-bottom: 8px; font-weight: bold; }
      .erro { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fecaca;
              padding: 10px 12px; border-radius: 10px; margin-bottom: 18px; }
      .mensagem { min-height: 1.25rem; margin: 16px 0 0; }
      details { margin-top: 24px; color: #cbd5e1; }
      summary { cursor: pointer; }
      details form { margin-top: 18px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Entrar</h1>
      <p>Use sua passkey, como Face ID, Touch ID, Windows Hello ou uma chave de segurança.</p>
      {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
      <button id="entrar-passkey" type="button">Entrar com passkey</button>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

      {% if not tem_passkey %}
      <details>
        <summary>Primeiro acesso: entrar com a chave atual para cadastrar uma passkey</summary>
        <form method="POST" action="/login">
          <input type="hidden" name="next" value="{{ next or '' }}" />
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required />
          <label for="chave_acesso">Chave de acesso</label>
          <input id="chave_acesso" name="chave_acesso" type="password" placeholder="Digite a chave de acesso" required />
          <button type="submit">Entrar para cadastrar uma passkey</button>
        </form>
      </details>
      {% endif %}
    </main>
    <script>
      const destino = {{ next|tojson }};
      const botao = document.getElementById("entrar-passkey");
      const mensagem = document.getElementById("mensagem");

      function decodificaBase64Url(valor) {
        const base64 = valor.replace(/-/g, "+").replace(/_/g, "/");
        const binario = atob(base64 + "=".repeat((4 - base64.length % 4) % 4));
        return Uint8Array.from(binario, caractere => caractere.charCodeAt(0));
      }

      function codificaBase64Url(buffer) {
        const bytes = new Uint8Array(buffer);
        let binario = "";
        bytes.forEach(byte => { binario += String.fromCharCode(byte); });
        return btoa(binario).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function serializaCredencial(credencial) {
        const resposta = credencial.response;
        return {
          id: credencial.id,
          rawId: codificaBase64Url(credencial.rawId),
          type: credencial.type,
          authenticatorAttachment: credencial.authenticatorAttachment,
          clientExtensionResults: credencial.getClientExtensionResults(),
          response: {
            authenticatorData: codificaBase64Url(resposta.authenticatorData),
            clientDataJSON: codificaBase64Url(resposta.clientDataJSON),
            signature: codificaBase64Url(resposta.signature),
            userHandle: resposta.userHandle ? codificaBase64Url(resposta.userHandle) : null
          }
        };
      }

      botao.addEventListener("click", async () => {
        if (!window.PublicKeyCredential || !navigator.credentials) {
          mensagem.textContent = "Este navegador não oferece suporte a passkeys.";
          return;
        }
        botao.disabled = true;
        mensagem.textContent = "Aguardando a confirmação da passkey...";
        try {
          const opcoesResposta = await fetch("/webauthn/autenticacao/opcoes", { method: "POST" });
          const opcoes = await opcoesResposta.json();
          if (!opcoesResposta.ok) throw new Error(opcoes.erro || "Não foi possível iniciar a autenticação.");

          opcoes.publicKey.challenge = decodificaBase64Url(opcoes.publicKey.challenge);
          opcoes.publicKey.allowCredentials = opcoes.publicKey.allowCredentials.map(item => ({
            ...item,
            id: decodificaBase64Url(item.id)
          }));
          const credencial = await navigator.credentials.get({ publicKey: opcoes.publicKey });
          if (!credencial) throw new Error("A autenticação foi cancelada.");

          const verificacaoResposta = await fetch("/webauthn/autenticacao/verificar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              challenge_id: opcoes.challenge_id,
              credential: serializaCredencial(credencial),
              next: destino
            })
          });
          const verificacao = await verificacaoResposta.json();
          if (!verificacaoResposta.ok) throw new Error(verificacao.erro || "A autenticação falhou.");
          window.location.assign(verificacao.redirect);
        } catch (erro) {
          mensagem.textContent = erro.name === "NotAllowedError"
            ? "Autenticação cancelada ou não aprovada."
            : erro.message;
          botao.disabled = false;
        }
      });
    </script>
  </body>
</html>
